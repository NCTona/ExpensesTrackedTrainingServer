stages:
  preprocess:
    cmd: python -m src.data.preprocess
    deps:
      - src/data/preprocess.py
      - data/raw/transactions.csv
    outs:
      - data/processed/
  
  train_lstm:
    cmd: python -m src.training.train_lstm
    deps:
      - src/training/train_lstm.py
      - data/processed/
    outs:
      - models/expense_model.tflite
      - models/meta_lstm.joblib

  train_lgbm:
    cmd: python -m src.training.train_lgbm
    deps:
      - src/training/train_lgbm.py
      - data/raw/transactions.csv
    outs:
      - models/category_forecast_lgbm.joblib

  train_iforest:
    cmd: python -m src.training.train_iforest
    deps:
      - src/training/train_iforest.py
      - data/raw/transactions.csv
    outs:
      - models/anomaly_iforest.joblib
